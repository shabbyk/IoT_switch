[package]
name = "iot-switch"
version = "0.1.0"
edition = "2021"
description = "General-purpose programmable smart switch for Raspberry Pi (web UI + schedules + manual override + GPIO relay)"

[dependencies]
anyhow = "1"
axum = "0.7"
chrono = { version = "0.4", features = ["clock"] }
rppal = "0.22"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"